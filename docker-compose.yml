services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cueai
      POSTGRES_PASSWORD: cueai
      POSTGRES_DB: cueai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cueai -d cueai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CUEAI_DATABASE_URL: postgresql+asyncpg://cueai:cueai@db:5432/cueai
      CUEAI_APP_ENV: prod
      # Taken from .env (or the shell) when compose starts.
      CUEAI_OPENAI_API_KEY: ${CUEAI_OPENAI_API_KEY:?set CUEAI_OPENAI_API_KEY in .env}
      CUEAI_OPENAI_MODEL: ${CUEAI_OPENAI_MODEL:-gpt-5.4-nano}
    ports:
      - "8000:8000"

volumes:
  pgdata:
